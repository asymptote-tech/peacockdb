name: Exec-model corpus (manual)

# The engine's own plan goldens run by the prototype over the sf1 tables, each against DuckDB
# running the query's own text: as planned, pruned by dynamic filters, reassembled, and
# reordered by DPhyp (the four test_engine_*.py files below). Manual dispatch: they need the
# generated datasets and take minutes. Beside them the call-cost job, over the sf40
# calibration record, which is not in git and is fetched from S3.
#
# PCK_SHARD=k/n gives process k every n-th test (scripts/exec_model/tests/harness.py), and a
# shard that selects nothing is an error. So the matrix's shard list and the `/3` in PCK_SHARD
# must agree, and the shard count may not exceed the smallest file's test count — 73 today,
# test_engine_dynamic_filters.py's.
on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'Run only tests whose name contains this (empty = all corpus tests)'
        required: false
        default: ''

jobs:
  corpus:
    name: Corpus queries (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4

      # Every project command below runs in the 25.02 build image through scripts/build-test.sh,
      # as the runner's uid, over this checkout: its venv's pandas and pyarrow, its rust, and the
      # pinned DuckDB on its PATH. The action frees the disk and pulls the image of this tree.
      - uses: ./.github/actions/build-image
        with:
          cudf: "25.02"

      # The optimized plans are ordered by the DPhyp crate, which the prototype calls through its
      # C ABI: built here, seconds, and named by PEACOCK_DPHYP_LIB for the run step.
      - name: Build the DPhyp library
        run: scripts/build-test.sh -- cargo build --release -p peacockdb-dphyp

      # The pipeline's generator step: the image's DuckDB, the pinned release build the committed
      # goldens come from, for the same reason (the dsdgen column types drift between releases).
      # Both benches, since the engine's plans cover both.
      - name: Generate SF-1 test data
        run: |
          set -euo pipefail
          scripts/build-test.sh -- duckdb --version
          scripts/build-test.sh -- testdata/generate_testdata.sh --bench tpch
          scripts/build-test.sh -- testdata/generate_testdata.sh --bench tpcds

      # build-test.sh hands PCK_SHARD to the image by itself; the oracle is the image's duckdb.
      - name: Run corpus queries
        env:
          PCK_SHARD: ${{ matrix.shard }}/3
          FILTER: ${{ inputs.filter }}
        run: |
          set -euo pipefail
          export PEACOCK_DPHYP_LIB=$PWD/target-img-$PEACOCK_CUDF/release/libpeacockdb_dphyp.so
          # Every file here is a corpus file, so no name filter is needed to select them; a
          # filter narrows within them. No `set -e` short-circuit on the first file: each
          # runs, statuses are OR'd, so one failure cannot hide another file's.
          status=0
          files=(scripts/exec_model/tests/plans/test_engine_answers.py
                 scripts/exec_model/tests/optimizer/test_engine_dynamic_filters.py
                 scripts/exec_model/tests/optimizer/test_engine_reassembled.py
                 scripts/exec_model/tests/optimizer/test_engine_optimized.py)
          for f in "${files[@]}"; do
            echo "== $f (shard $PCK_SHARD)"
            scripts/build-test.sh --pass-env PEACOCK_DPHYP_LIB -- python3 "$f" ${FILTER:+"$FILTER"} || status=1
          done
          exit $status

  # One test, so unsharded, and no query to filter on: it runs only when no filter is given.
  # The record is fetched by the script every host uses, verified against the sha256 this
  # checkout pins; the image's aws CLI reads the same S3 secrets as pipeline.yml's s3-datasets
  # job, passed in by name.
  call-cost:
    name: Per-call model on the measured record
    if: inputs.filter == ''
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-image
        with:
          cudf: "25.02"

      - name: Fetch the sf40 calibration record
        run: |
          scripts/build-test.sh --pass-env AWS_ACCESS_KEY_ID --pass-env AWS_SECRET_ACCESS_KEY -- \
            scripts/calibration/fetch_record.sh tpch.sf40

      - name: Run the per-call model's check
        run: scripts/build-test.sh -- python3 scripts/exec_model/tests/optimizer/test_call_cost_measured.py
