name: CI Pipeline

# Documentation-only changes skip the whole pipeline. Nothing under llm-wiki/ or any
# .md file is read by a build, a test or a golden, so a doc file that becomes an input
# has to come off this list. One has: llm-wiki/reports/query-batching.md, which a step
# checks against batching_report.py. Both `paths:` triggers re-include it and the
# `changes` job counts it as code. A run starts when any changed file is left in. No
# status check is required on master, so a skipped run leaves a PR mergeable.
on:
  push:
    branches: [master]
    paths:
      - '**'
      - '!**.md'
      - '!llm-wiki/**'
      - 'llm-wiki/reports/query-batching.md'
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!llm-wiki/**'
      - 'llm-wiki/reports/query-batching.md'
  # The only way a branch reaches gpu-tests: `gh workflow run pipeline.yml --ref <branch>`, by
  # an actor with write access who is also listed in GPU_ALLOWED_ACTORS. It runs the whole
  # pipeline, as a push to master does (`changes` answers code=true for any non-PR event).
  workflow_dispatch:

jobs:
  # The path filter above is not enough on its own. For a pull_request event GitHub
  # evaluates it against the WHOLE PR diff, not the commits just pushed, so a PR that
  # touches any code runs the full pipeline on every later docs-only push — measured,
  # not assumed: a docs-only push to #118 started run 31644108948 with the filter live.
  #
  # Fail-open by construction. It answers `code=true` — run everything — for any event
  # that is not a synchronize, a force push or rebase, an unreadable compare, a range at
  # the API's page limit, and any file it cannot place. Only a clean append of
  # documentation skips. A wrong skip is not a hole into master: merging there re-runs from
  # scratch, and `branches: [master]` means a chain PR reaches that run when its root does.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - name: Is this push documentation-only?
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          # Every exit but the last one is "run the pipeline", and each says why, so a
          # skip is never silent and neither is a fallback.
          everything() { echo "code=true" >> "$GITHUB_OUTPUT"; echo "running in full: $1"; exit 0; }

          [ "$EVENT" = pull_request ] && [ "$ACTION" = synchronize ] \
            || everything "${EVENT}/${ACTION:-none} is not a pull-request push"
          [ -n "$BEFORE" ] && [ -n "$AFTER" ] || everything "the payload carries no before/after"

          # The compare API rather than a checkout: no fetch-depth guessing about whether
          # $BEFORE is still reachable, and a force push is reported rather than inferred.
          cmp=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$AFTER") \
            || everything "could not compare $BEFORE...$AFTER"
          status=$(jq -r '.status' <<<"$cmp")
          [ "$status" = ahead ] \
            || everything "the new head is '$status' of the old one, not a clean append"
          count=$(jq -r '(.files // []) | length' <<<"$cmp")
          [ "$count" -lt 300 ] || everything "$count files — at the compare endpoint's page limit"

          files=$(jq -r '(.files // [])[].filename' <<<"$cmp")
          echo "changed in this push:"; echo "${files:-(nothing)}" | sed 's/^/  /'
          # The trigger lists' patterns above; they must stay in step, the page included.
          if grep -qvE '(\.md$|^llm-wiki/)' <<<"$files" \
              || grep -qxF 'llm-wiki/reports/query-batching.md' <<<"$files"; then
            everything "the push changes more than documentation"
          fi
          echo "code=false" >> "$GITHUB_OUTPUT"
          echo "documentation only — skipping the pipeline for this push"

  # What this tier OFFERS: the generated sf1 dataset and the cuDF matrix. `cost-report` has
  # neither, which is what the two names distinguish.
  # What LANDS here is a different question, and the answer is production code — the engine's
  # tests belong together whether or not each one needs the dataset, and `cost-report` holds
  # the report crate and its inputs. Several steps below need nothing this tier offers and
  # are here for that rule rather than in spite of it.
  dataset-matrix:
    strategy:
      fail-fast: false
      matrix:
        # Each leg runs in the build image of its cuDF, peacockdb-build:cudf-<v> (llm-wiki/build-test.md,
        # "Images"). 25.10's image is CI's only: it has no run image.
        include:
          - cudf: "25.10"
          - cudf: "25.02"
    name: CI Pipeline (cudf ${{ matrix.cudf }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # A `run:` with no shell is `bash -e {0}`; a declared bash adds `-o pipefail`, which every step
    # here assumes. Declared at the job, so the next step added cannot do without it.
    defaults:
      run:
        shell: bash

    # Job level, not per step: build-test.sh hands both to every command it runs in the image, and
    # each is part of what cargo compares before reusing a build. RUSTFLAGS is in every crate's
    # fingerprint, and CMAKE_GENERATOR reruns the build scripts that run cmake (flatc-fork's and
    # the FFI's), so a step carrying its own copy recompiles. That is why "Run Rust tests"
    # compiles nothing that "Build Rust tests" built.
    env:
      CMAKE_GENERATOR: Ninja
      # No debug info in any Rust artifact. The test binaries link the full DataFusion/Arrow stack,
      # and the default-feature ones libpeacock_gpu too. With debuginfo the largest of them was
      # gigabytes, and the leg's target dir shares the runner's disk with the build image. Debug
      # info is dead weight for pass/fail CI.
      RUSTFLAGS: "-C debuginfo=0"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Every project command below runs in the leg's build image through scripts/build-test.sh,
      # as the runner's uid, over this checkout. The action frees the disk, pulls the image of this
      # tree's inputs and restores the C++ ccache.
      - uses: ./.github/actions/build-image
        with:
          cudf: ${{ matrix.cudf }}
          ccache: 'true'

      - uses: ./.github/actions/cpp-build
        with:
          cudf: ${{ matrix.cudf }}

      # The cargo registry and the leg's target dir, build-test.sh's target-img-<cudf>, so the
      # opt-level-3 DataFusion/Arrow tree compiles once and restores on warm runs. One cache per
      # leg: each leg has its own target dir, built by its own image's gcc for the build scripts'
      # C++.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-image-${{ matrix.cudf }}
          # The image built what the target dir holds; Swatinem's own key does not see it.
          key: ${{ env.PEACOCK_BUILD_IMAGE }}
          workspaces: ". -> target-img-${{ matrix.cudf }}"

      - name: Run CPU tests (CPP)
        run: scripts/build-test.sh -- ctest --test-dir cpp/build -L cpu --output-on-failure

      - name: Generate SF-1 test data
        run: |
          set -euo pipefail
          # The image's DuckDB, the official release build of docker/pins.env's DUCKDB_VERSION and
          # DUCKDB_SHA256, with its tpch and tpcds extensions installed in the image. It is the
          # build the committed goldens are generated with, so the parquet is byte-identical: the
          # TPC-DS dsdgen column types drift across releases (INT32 against INT64 surrogate keys),
          # which would move row_width and target_batch_size in every plan golden.
          # generate_testdata.sh asserts the version.
          scripts/build-test.sh -- duckdb --version
          scripts/build-test.sh -- testdata/generate_testdata.sh --bench tpch
          scripts/build-test.sh -- testdata/generate_testdata.sh --bench tpcds
          # pbench is COMMITTED, not generated: this proves the committed parquet is what
          # gen.sql makes under this exact DuckDB, including the float specials a dictionary
          # page would silently canonicalize (llm-wiki/tasks/pbench.md).
          scripts/build-test.sh -- testdata/generate_pbench.sh --check

      # duckdb_minimal.sh, the DuckDB timing script the 128-core VM runs at sf40, over the sf1
      # generated above: the import, the timing loop, the answers pass and the results file's
      # shape. Python and DuckDB only, which cannot see cuDF, so one leg.
      - name: DuckDB benchmark script (Python)
        if: matrix.cudf == '25.02'
        run: scripts/build-test.sh -- python3 benchmarks/tests/test_duckdb_minimal.py

      # The query-batching page's numbers against the committed results they are read from:
      # a commit that changes one of those inputs without rerunning batching_report.py fails
      # here, and rerunning it locally mends that. A changed cases.csv is not refused: a fused
      # batch it no longer matches is named stale on the page, for a rerun on the H100. Python
      # over committed text, so one leg; beside pbench's --check, which proves the same of its
      # parquet. cost-report's ci_coverage.rs fails if this line goes.
      - name: Query-batching page is current (Python)
        if: matrix.cudf == '25.02'
        run: |
          set -euo pipefail
          scripts/build-test.sh -- python3 scripts/calibration/batching_report.py --testdata testdata \
            --report llm-wiki/reports/query-batching.md --check

      # The exec-model prototype's statistics sidecars counted again from the data by
      # gen_stats.py with the image's DuckDB, and its row estimates against the engine's CPU runs,
      # which need the sf1 tables generated above — the rest of that suite runs in the cost-report
      # tier, which has no dataset. One matrix leg only: the two legs differ in cuDF, which
      # this pure-python test cannot see, and a second run would only report the same failure
      # twice. The engine's plans run over the same tables in exec-model-corpus.yml on manual
      # dispatch: they are minutes rather than seconds. test_ordered_corpus.py orders every
      # golden plan without running it, a minute or two, and test_run_corpus.py runs run.py
      # over two small queries, twenty seconds; both call DPhyp, so the library is built here.
      - name: Exec-model statistics, row estimates and run.py (Python)
        if: matrix.cudf == '25.02'
        run: |
          set -euo pipefail
          scripts/build-test.sh -- cargo build --release -p peacockdb-dphyp
          export PEACOCK_DPHYP_LIB=$PWD/target-img-$PEACOCK_CUDF/release/libpeacockdb_dphyp.so
          # Every file runs before the step reports, so one failure does not hide the rest.
          status=0
          for f in scripts/exec_model/tests/optimizer/test_stats_sidecar.py \
                   scripts/exec_model/tests/optimizer/test_cardinality_corpus.py \
                   scripts/exec_model/tests/optimizer/test_ordered_corpus.py \
                   scripts/exec_model/tests/test_run_corpus.py; do
            echo "== $f"
            scripts/build-test.sh --pass-env PEACOCK_DPHYP_LIB -- python3 "$f" || status=1
          done
          exit "$status"

      # The rust tests that read committed goldens rather than a device or a dataset. They
      # ran in the cost-report tier until that tier was named for what it contains rather
      # than for what decides placement — they are prod-code tests and this is where
      # prod-code tests live. ONE matrix leg, for the reason the exec-model step above
      # gives: a rust-only test cannot see cuDF, so a second leg would report the same
      # failure twice.
      #
      # Verify every committed .cost.txt exactly matches regeneration from its
      # sibling .cpu.txt plan golden (full-file, not just the total), and the
      # cost-model unit test. Pure text over committed goldens — no executor, no
      # dataset, no GPU.
      - name: Cost goldens match plan-golden regeneration (Rust)
        if: matrix.cudf == '25.02'
        run: scripts/build-test.sh -- cargo test --features rust-only -p peacockdb-core --test test_cost_model

      # The one reader of the golden text format, against strings rather than files:
      # no dataset, no executor — it belongs beside the cost model.
      # Every other golden assertion in the tree is a comparison through it.
      - name: The golden text format, read back (Rust)
        if: matrix.cudf == '25.02'
        run: scripts/build-test.sh -- cargo test --features rust-only -p peacockdb-core --test test_golden_format

      # The corpus goldens against their own arithmetic — conservation, lane counts,
      # the loader prefix, the root against the result. Committed files only, so it
      # needs no dataset of its own.
      - name: Corpus goldens against their own redundancy (Rust)
        if: matrix.cudf == '25.02'
        run: scripts/build-test.sh -- cargo test --features rust-only -p peacockdb-core --test test_corpus_goldens

      # Tier A: structural validation of the freshly generated sf1 data, on both legs. CI
      # generates SYNTHETIC embeddings (no fetch), so the DEEP/GloVe embedding checks auto-skip
      # on FLOAT[8]; the row-count / schema / sort-order / clustering checks always run. numpy
      # and pyarrow are the image's venv's, at docker/venv.lock's pins.
      - name: Validate sf1 datasets
        run: |
          set -euo pipefail
          scripts/build-test.sh -- python3 scripts/validate_tpch.py --sf 1
          scripts/build-test.sh -- python3 scripts/validate_tpcds.py --sf 1

      # Build and run are split into two steps so a compile failure is visibly
      # distinct from a test failure, and build vs run time is legible (the
      # opt-level bump made the build phase much heavier). The two steps MUST
      # share a byte-identical env: cargo's fingerprint includes RUSTFLAGS, so any
      # drift would make the run step silently recompile, defeating the split. That is
      # structural for RUSTFLAGS and CMAKE_GENERATOR, which come from the job, and for
      # LD_LIBRARY_PATH, which the two steps set alike.
      - name: Build Rust tests
        run: |
          set -euo pipefail
          # EVERY target the run step invokes must be listed here, or its compile
          # failure surfaces as a run-step failure and the split stops meaning
          # anything.
          scripts/build-test.sh -- cargo test --no-run -p peacockdb-core --lib
          scripts/build-test.sh -- cargo test --no-run -p peacockdb-ffi --test test_ffi
          # Separate line because of --features rust-only: cargo's fingerprint
          # includes the feature set, so this cannot share the invocation above.
          # The feature only reaches peacockdb-ffi/peacockdb-core, not the
          # DataFusion/Arrow graph, so the extra compile is small.
          #
          # --lib is built twice, once per rung, and the two are different binaries: the
          # rust-only one here carries the cpu rung and does not link libpeacock_gpu, a
          # smaller link, while the default-feature one above carries the ffi rung as well. Each
          # shares its own line's already-built fingerprint, so neither costs an extra compile.
          scripts/build-test.sh -- cargo test --no-run --features rust-only -p peacockdb-core --lib
          # The CLI, which has no test target of its own and so is named by nothing above.
          # It is the only caller of the planner and the driver from outside the crate, so a
          # signature change that the tests absorb still breaks it — and unbuilt, it breaks
          # at the merge gate of whoever notices next. test_source_formatting asserts this line.
          scripts/build-test.sh -- cargo build --features rust-only -p peacockdb
        env:
          # build-test.sh hands it to the image by name; the step's own, beside the job's two.
          LD_LIBRARY_PATH: /opt/cudf/lib

      # Pure run: the targets were already compiled by "Build Rust tests" above
      # with the identical env below, so cargo finds matching fingerprints and
      # does NOT recompile here (no "Compiling …"). The env block must stay
      # byte-identical to the build step; RUSTFLAGS, the one that matters most, is the
      # job's and identical by construction.
      - name: Run Rust tests
        run: |
          set -euo pipefail
          # The middle rung: every test module that needs the FFI linked and no device,
          # selected by path. GpuBatch's surface is all of it today — a handle plus a Drop
          # whose release is null-guarded, so nothing here reaches a card. The device half
          # of that ABI is `gpu_backend::gpu_tests::abi`, which the gpu-tests job runs.
          scripts/build-test.sh -- cargo test -p peacockdb-core --lib -- ffi_tests::
          scripts/build-test.sh -- cargo test -p peacockdb-ffi --test test_ffi
          # The cpu rung, entire: every in-crate test module that needs neither the FFI
          # nor a device. It needs the sf1 dataset generated above: the plan goldens read
          # row-group metadata off the parquet, and the end-to-end tier runs against it.
          # test_source_formatting asserts this line exists.
          scripts/build-test.sh -- cargo test --features rust-only -p peacockdb-core --lib
          # The corpus on the same path: every enabled query at every mode its line
          # declares, answers against DataFusion. Needs sf1, so it lives here and not
          # in the golden-only tier.
          scripts/build-test.sh -- cargo test --features rust-only -p peacockdb-core --test test_cpu_corpus
        env:
          # build-test.sh hands it to the image by name; the step's own, beside the job's two.
          LD_LIBRARY_PATH: /opt/cudf/lib

  # Standalone build job for the GPU host's artifact — runs in parallel with dataset-matrix
  # so gpu-tests can start as soon as the build is done, without waiting for the
  # CPU tests + Rust tests to finish.
  cpp-build-2502:
    name: CI Pipeline (build 25.02 for GPU)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    # As dataset-matrix's, and for its reasons: build-test.sh hands both to the image, cargo's
    # fingerprint holds RUSTFLAGS, and without debug info the GPU test binaries link within the
    # runner's disk.
    env:
      CMAKE_GENERATOR: Ninja
      RUSTFLAGS: "-C debuginfo=0"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The 25.02 build image of this tree's inputs, and the C++ ccache. The key is the 25.02
      # leg's, ccache-img-25.02-<sha>: whichever job saves second in a run is refused with a
      # warning, not an error.
      - uses: ./.github/actions/build-image
        with:
          cudf: "25.02"
          ccache: 'true'

      # The target dir is build-test.sh's target-img-25.02, as the 25.02 leg's is, but the
      # cache is this job's own: it builds --features gpu, a different shape, and runs beside
      # that leg, so a shared key would only contend for the save.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-gpu-build-image
          # The image built what the target dir holds; Swatinem's own key does not see it.
          key: ${{ env.PEACOCK_BUILD_IMAGE }}
          workspaces: ". -> target-img-25.02"

      # scripts/env/stage-install.sh in the build image: the C++ built and installed into
      # cpp/install, and the device rung, built --features gpu, staged from empty into
      # cpp/install/rust-tests/ (build-test.md, "CI structure"). No release benchmark: CI runs
      # none. The run image's /opt/cudf holds cuDF, Arrow and Parquet, so the install carries
      # only the project's own libraries.
      - name: Build and stage rust GPU test binaries
        run: scripts/build-test.sh --gpu --build --no-release-bench

      # A tarball, not the directory: upload-artifact stores each symlink as a full copy of its
      # target and drops the exec bits.
      - name: Pack GPU test binaries
        run: tar -C cpp -cf cpp-install.tar install

      - name: Upload GPU test binaries
        uses: actions/upload-artifact@v4
        with:
          name: cpp-install-25.02
          path: cpp-install.tar
          retention-days: 1

  # nebius-gpu, an L40S VM this job starts and soft-stops (llm-wiki/build-test.md, "Nebius host").
  # It costs money while it runs, so the job runs on a push to master and on a dispatch, never
  # on a pull_request: a PR's branch gets it when someone with write access, listed in
  # GPU_ALLOWED_ACTORS, dispatches the pipeline on that branch. A fork PR gets no secrets and
  # no GPU job. The secrets live in the nebius-gpu Environment, which only this job and
  # nebius-watch.yml reference. The tests run in the run image on the VM, through
  # scripts/env/run-gpu.sh; the runner holds no image.
  gpu-tests:
    name: GPU Tests (nebius-gpu)
    needs: cpp-build-2502
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: nebius-gpu
    # This job holds the cloud's keys; its token needs nothing beyond reading the repo.
    permissions:
      contents: read
    # A wedged remote must cost minutes, not GitHub's six-hour default. The budget is the start
    # (capacity can take half an hour), prepare, the transfer and the suite; if the suite ever
    # outgrows it, raise it deliberately rather than removing it.
    timeout-minutes: 150
    # One physical device, so one of these at a time across every ref. Two jobs on the same
    # GPU contend for its memory, and --test-threads=1 keeps one test at a time inside a
    # process but cannot reach across two. Queued rather than cancel-in-progress: a cancelled
    # run can leave its container and the device's state behind.
    concurrency:
      group: nebius-gpu
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      # checkout runs no project code, so nothing from the branch runs before the check below.
      - uses: actions/checkout@v4

      - name: Only allowed actors reach the GPU host
        # Through env, never ${{ }} inside the script: an expression expanded into `run:` is
        # a script-injection hole. Both actors are checked: a re-run keeps the original
        # github.actor (and its privileges), and triggering_actor is whoever pressed re-run.
        # This step keeps the VM from a writer who is not on the list. It cannot stop one who
        # edits this file on their own branch. Writers are trusted; GPU_ALLOWED_ACTORS and this
        # check are the gate (llm-wiki/build-test.md, "CI and its secrets").
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          ALLOWED: ${{ vars.GPU_ALLOWED_ACTORS }}
        run: |
          scripts/nebius/check-actor.sh "$ACTOR" "$ALLOWED"
          scripts/nebius/check-actor.sh "$TRIGGERING_ACTOR" "$ALLOWED"

      - name: Download GPU test binaries
        uses: actions/download-artifact@v4
        with:
          name: cpp-install-25.02
          path: .

      - name: Unpack GPU test binaries
        run: mkdir -p cpp && tar -C cpp -xf cpp-install.tar && rm cpp-install.tar

      - uses: ./.github/actions/nebius-setup
        with:
          sa-id: ${{ secrets.NEBIUS_SA_ID }}
          public-key-id: ${{ secrets.NEBIUS_PUBLIC_KEY_ID }}
          project-id: ${{ secrets.NEBIUS_PROJECT_ID }}
          private-key: ${{ secrets.NEBIUS_PRIVATE_KEY }}
          ssh-key: ${{ secrets.NEBIUS_GPU_SSH_KEY }}

      # The images of this tree's inputs, as digests, found before the VM is paid for: by
      # inputs, never by a moving tag, so a branch's publication never changes what another
      # tree runs. prepare pulls both and checks their labels against the tree; run checks the
      # run image's again. The build image is prepare's, for sf1.
      - name: Find the run and build images
        run: |
          set -euo pipefail
          run=$(scripts/env/image-ref.sh run 25.02)
          build=$(scripts/env/image-ref.sh build 25.02)
          echo "run image: $run"
          echo "build image: $build"
          {
            echo "PEACOCK_RUN_IMAGE=$run"
            echo "PEACOCK_BUILD_IMAGE=$build"
          } >> "$GITHUB_ENV"

      - name: Start nebius-gpu (up to 30 minutes for capacity)
        id: start
        # One attempt can itself wait out STOPPING, RUNNING and ssh (nebius.sh's own bounds),
        # so the step's limit sits well past the 30-minute retry window.
        timeout-minutes: 75
        run: |
          # 75 is "no capacity or quota, retry later"; every other failure is final.
          deadline=$((SECONDS + 1800))
          while :; do
            rc=0; scripts/nebius.sh start || rc=$?
            [ "$rc" -eq 0 ] && exit 0
            [ "$rc" -eq 75 ] || exit "$rc"
            [ "$SECONDS" -lt "$deadline" ] || break
            echo "no capacity yet (rc 75); retrying in 2 minutes"; sleep 120
          done
          echo "::error::nebius-gpu did not start within 30 minutes: no capacity"
          exit 75

      # Docker and the NVIDIA Container Toolkit if missing, the two images, and sf1, generated
      # in the build image once per generator inputs. All of it is kept on the VM, so a run
      # whose images and data the VM already holds only checks them. --no-sf40: the L40S list
      # reads no sf40 and needs none of Nsight's setup.
      - name: Prepare nebius-gpu
        timeout-minutes: 40
        run: scripts/env/run-gpu.sh --instance-id computeinstance-e00tnrse7ayntnzcyt --dir ci prepare --no-sf40

      - name: Ship the staged install
        # The install and the committed testdata into ~/peacock/ci/ on the VM, which persists
        # between runs, so later runs send only what changed. --dir ci on every call: the default,
        # the checkout's name, is a developer's clone's on the VM too. Four zstd rsync streams
        # with retries: the runner-to-VM path is slow and lossy (0.24 MB/s for one stream,
        # 2026-10-15), so a first run can take most of the limit.
        timeout-minutes: 50
        run: scripts/env/run-gpu.sh --instance-id computeinstance-e00tnrse7ayntnzcyt --dir ci ship --install cpp/install

      - name: Run the L40S list
        # The run image's run-tests.sh list, as container peacock-ci, its log followed;
        # the step exits as the run did. What the list keeps from this job's history:
        # - Every shipped peacock_*_tests binary, by glob rather than a hand-written list: a
        #   named list once let peacock_tpchv_tests be built, shipped and never run, green.
        # - Zero-test guards. A binary whose tests all skip exits 0 and renders GREEN having
        #   verified nothing, so "[  PASSED  ] 0 tests" (C++) and "running 0 tests" (rust)
        #   fail it. A guard scoped to one binary cannot notice a different binary missing,
        #   so an empty glob in either half fails the run too.
        # - Every binary runs even after an earlier one fails; the run fails at the end.
        # - --test-threads=1 for the rust binaries: cuDF/RMM share one process-wide pool, and
        #   concurrent GPU tests OOM the device and poison the CUDA context for every later test.
        # - A segfault, or a death by a signal, fails the run.
        # Out of it on an L40S: the sf40 pair and every bench_ case.
        run: scripts/env/run-gpu.sh --instance-id computeinstance-e00tnrse7ayntnzcyt --dir ci run list

      - name: Clean up and soft-stop
        # Whenever the start step ran at all: a start that failed or was cancelled half way can
        # still leave the VM up. Soft, because a process on the card is someone else's (the VM
        # is shared, with no lock); the idle watcher and the hourly checker take it down later.
        if: always() && contains(fromJSON('["success", "failure", "cancelled"]'), steps.start.outcome)
        run: |
          # A cancelled run leaves its container running on the VM, and a process on the card
          # keeps the idle watcher from stopping it; the next run's `run` would refuse the busy
          # name. Remove it first: peacock-ci alone, never a developer's run.
          scripts/nebius.sh ssh 'docker rm -f peacock-ci' || true
          scripts/nebius.sh stop || echo "soft stop declined (rc=$?); the watchers will take it down"

  # GPU coverage + cost-ratio report (Task 6). Pure CPU/dry: reads only the
  # committed goldens (.cpu.txt = PeacockDB cost, .duckdb_cost.txt = DuckDB
  # oracle) and the test skip list — no GPU, no verda, no executor build. On a
  # PR it upserts a single comment; on master it publishes to GitHub Pages, with
  # the join optimizer's report beside it at join-optimizer/.
  cost-report:
    name: Cost report (coverage + ratio)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the PR base commit is present for the cost-regression
          # gate's `git show <base.sha>:…` baseline read (default checkout is shallow).
          fetch-depth: 0

      # Every project command below runs in the build image, through scripts/build-test.sh: the
      # image's rust, and its Python with the venv the committed costs ran on. Only shellcheck,
      # curl and the comment upserts run on the runner (cost-report's ci_images.rs).
      - uses: ./.github/actions/build-image
        with:
          cudf: "25.02"

      # Cache the Rust dep tree so this job restores the opt-3 deps instead of
      # recompiling the whole DataFusion/Arrow stack (the opt-level bump pushed this
      # job 3m30s -> 15m40s cold). Own shared-key, NOT dataset-matrix's: this job sets no
      # RUSTFLAGS (keeps debug symbols), whereas dataset-matrix builds with -C debuginfo=0,
      # so the dep fingerprints differ — a shared key would fingerprint-miss and
      # rebuild anyway. The target dir is build-test.sh's, and the registry the one the
      # action mounts, the runner's ~/.cargo/registry.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-cost-report-image
          # The image built what the target dir holds; Swatinem's own key does not see it.
          key: ${{ env.PEACOCK_BUILD_IMAGE }}
          workspaces: ". -> target-img-25.02"

      # Guard the two DuckDB generators' logic on every PR (before generating), so a
      # broken classifier/normalizer, or a result rendering that drifted from arrow-rs,
      # fails CI fast. Neither file needs duckdb or parquet.
      #
      # Enumerated by glob for the reason the exec-model step below gives: there is no meta
      # guard over python files, so a hand-written list rots the way the CI coverage
      # guard exists to prevent.
      - name: DuckDB generator unit tests (Python)
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(testdata/test_*.py)
          # A vanished glob makes the loop body disappear and the step pass green.
          [ ${#files[@]} -gt 0 ] || { echo "no testdata test files matched"; exit 1; }
          status=0
          for f in "${files[@]}"; do
            echo "== $f"
            # Run every file before reporting, so one failure does not hide the rest.
            scripts/build-test.sh -- python3 "$f" || status=1
          done
          exit "$status"

      # The report widget's registry reader: a quoted oracle cell, a registry older than the
      # duckdb_oracle column, and the include fallback. Stdlib only, no cargo.
      - name: Ticket widget unit tests (Python)
        run: scripts/build-test.sh -- python3 scripts/test_ticket_widget.py

      # The execution-model prototype. No project code, so it belongs
      # in this cheap tier next to the extractor tests. The scheduler tests are stdlib
      # only; the operator tests need pandas, and they FAIL rather than skip when it is
      # absent — a skipped operator suite reads exactly like a passing one. The image's
      # venv has it, at the version the committed costs ran on.
      #
      # Enumerated by glob rather than by name, unlike the rust targets above: there is
      # no meta guard over python files, so a hand-written list would rot the way
      # the CI coverage guard exists to prevent.
      - name: Exec-model prototype tests (Python)
        run: |
          set -euo pipefail
          # test_dphyp.py calls the DPhyp crate through its C ABI and refuses to run without
          # it, so the library is built here, seconds, and named for it.
          scripts/build-test.sh -- cargo build --release -p peacockdb-dphyp
          export PEACOCK_DPHYP_LIB=$PWD/target-img-$PEACOCK_CUDF/release/libpeacockdb_dphyp.so
          # globstar: the tests sit in one folder per component, and `**` also matches
          # tests/ itself.
          shopt -s nullglob globstar
          # Eight of these need the generated sf1 tables, which this job does not have.
          # test_stats_sidecar.py, test_cardinality_corpus.py, test_ordered_corpus.py and
          # test_run_corpus.py run in dataset-matrix; the four engine-plan files run in
          # exec-model-corpus.yml on manual dispatch.
          # test_stats_embeddings.py generates its own tables from the embeddings cache,
          # which no CI host may fetch, so it is run by hand. test_call_cost_measured.py
          # reads the sf40 calibration record, which is not in git: exec-model-corpus.yml's
          # call-cost job fetches it from S3 and runs it. Named rather than
          # pattern-matched, and a missing one is an error, so renaming a file cannot
          # silently drop it from every job.
          elsewhere=(scripts/exec_model/tests/plans/test_engine_answers.py
                     scripts/exec_model/tests/optimizer/test_engine_dynamic_filters.py
                     scripts/exec_model/tests/optimizer/test_stats_sidecar.py
                     scripts/exec_model/tests/optimizer/test_stats_embeddings.py
                     scripts/exec_model/tests/optimizer/test_cardinality_corpus.py
                     scripts/exec_model/tests/optimizer/test_ordered_corpus.py
                     scripts/exec_model/tests/optimizer/test_engine_reassembled.py
                     scripts/exec_model/tests/optimizer/test_engine_optimized.py
                     scripts/exec_model/tests/optimizer/test_call_cost_measured.py
                     scripts/exec_model/tests/test_run_corpus.py)
          for e in "${elsewhere[@]}"; do
            [ -f "$e" ] || { echo "$e is missing; is it still run elsewhere?"; exit 1; }
          done
          files=()
          for f in scripts/exec_model/tests/**/test_*.py; do
            case " ${elsewhere[*]} " in *" $f "*) ;; *) files+=("$f") ;; esac
          done
          # A vanished glob makes the loop body disappear and the step pass green.
          [ ${#files[@]} -gt 0 ] || { echo "no exec-model test files matched"; exit 1; }
          status=0
          for f in "${files[@]}"; do
            echo "== $f"
            # Run every file before reporting, so one failure does not hide the rest.
            scripts/build-test.sh --pass-env PEACOCK_DPHYP_LIB -- python3 "$f" || status=1
          done
          exit "$status"

      # The calibration scripts' own tests: a synthetic capture and a synthetic record, so
      # no device, no nsys and no measurement. Beside the exec-model set because they are
      # the same kind of thing — python over text, cheap, and nothing else in CI runs them.
      # plot.py is a hard import of matplotlib, which the image's venv has; a test that
      # skipped for want of it would read exactly like a passing one.
      - name: Calibration script tests (Python)
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(scripts/calibration/tests/test_*.py)
          # A vanished glob makes the loop body disappear and the step pass green.
          [ ${#files[@]} -gt 0 ] || { echo "no calibration test files matched"; exit 1; }
          status=0
          for f in "${files[@]}"; do
            echo "== $f"
            # Run every file before reporting, so one failure does not hide the rest.
            scripts/build-test.sh -- python3 "$f" || status=1
          done
          exit "$status"

      # The Nebius VM scripts, against fake nebius/ssh and synthetic clocks: no VM, no secret.
      # The tests run in the image. shellcheck stays on the runner, which has it: a linter over
      # the scripts, running none of the project's code, and the image has none. Over the Nebius
      # scripts and the image path CI's GPU job runs; -x follows what each one sources.
      - name: Nebius script tests
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(scripts/nebius/tests/test_*.py)
          # A vanished glob makes the loop body disappear and the step pass green.
          [ ${#files[@]} -gt 0 ] || { echo "no nebius test files matched"; exit 1; }
          status=0
          for f in "${files[@]}"; do
            echo "== $f"
            scripts/build-test.sh -- python3 "$f" || status=1
          done
          shellcheck -x scripts/nebius.sh scripts/nebius-sync.sh scripts/nebius/check-actor.sh \
            scripts/nebius/watch.sh scripts/build-test.sh scripts/env/run-gpu.sh \
            scripts/env/image-ref.sh scripts/env/stage-install.sh scripts/env/nebius-profiles.sh || status=1
          exit "$status"

      # The image, image-ref, build-test and run-gpu scripts, against fake docker, ssh and aws.
      # needs_docker are the three that build or run the images themselves: by hand
      # (build-test.md, "Images"); images.yml's run job runs test_run_tests.py. on_runner are
      # stdlib only and need what the image cannot give the runner's uid: a locale that sorts
      # unlike C, en_US.UTF-8 (#309: test_fetch_sf40.py, test_image.py), or a user name, which
      # bootstrap-vm.sh and provision-vm.sh read as the VM's or laptop's own user, and real ssh
      # needs (test_ssh_retry.py). Both named, and a missing one is an error, as the exec-model
      # step's elsewhere list is.
      - name: Image and run script tests (Python)
        run: |
          set -euo pipefail
          shopt -s nullglob
          needs_docker=(test_image_any_user.py test_run_image.py test_run_tests.py)
          on_runner=(test_fetch_sf40.py test_image.py test_bootstrap.py test_provision.py test_ssh_retry.py)
          for n in "${needs_docker[@]}" "${on_runner[@]}"; do
            [ -f "scripts/env/tests/$n" ] || { echo "scripts/env/tests/$n is missing; is it still named here?"; exit 1; }
          done
          files=()
          for f in scripts/env/tests/test_*.py; do
            case " ${needs_docker[*]} ${on_runner[*]} " in *" ${f##*/} "*) ;; *) files+=("$f") ;; esac
          done
          # A vanished glob makes the loop body disappear and the step pass green.
          [ ${#files[@]} -gt 0 ] || { echo "no image script test files matched"; exit 1; }
          status=0
          for f in "${files[@]}"; do
            echo "== $f"
            # Run every file before reporting, so one failure does not hide the rest.
            scripts/build-test.sh -- python3 "$f" || status=1
          done
          for n in "${on_runner[@]}"; do
            echo "== scripts/env/tests/$n, on the runner"
            python3 "scripts/env/tests/$n" || status=1
          done
          exit "$status"

      - name: cost-report unit tests (Rust)
        run: scripts/build-test.sh -- cargo test -p cost-report --bin cost-report

      # Dependency-free, so it builds in seconds beside cost-report rather than in the jobs that
      # carry the DataFusion stack.
      - name: DPhyp unit tests (Rust)
        run: scripts/build-test.sh -- cargo test -p peacockdb-dphyp

      # The tests whose subject is the source tree: every rust test target wired into CI (CI
      # does not sweep them as a set, so a new tests/*.rs is invisible here until someone adds
      # it), the module layout rules nothing in rustc checks, a doc block a split left behind,
      # and that no peacockdb-core test reads the checkout. They read src/, tests/ and the
      # workflows, so they live in cost-report, which is never staged to a remote host.
      - name: The source tree's own rules hold
        run: scripts/build-test.sh -- cargo test -p cost-report --test test_source_formatting

      # A component's private module is unreachable from outside the crate: a probe compiled
      # against the built library, so it needs no dataset and no device.
      - name: A private module is unreachable from outside the crate
        run: scripts/build-test.sh -- cargo test --features rust-only -p peacockdb-core --test test_crate_privacy

      - name: Generate report
        env:
          # Golden cell links point at the code version the report was generated
          # from: the PR head commit on PRs (GITHUB_SHA is the merge ref there),
          # the pushed commit on master. cost-report reads GITHUB_REPOSITORY for the slug, so it
          # is passed into the image.
          REPORT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          PAGES_URL: https://asymptote-tech.github.io/peacockdb
        run: |
          mkdir -p report
          GENERATED_AT="$(TZ='America/Los_Angeles' date '+%Y-%m-%d %H:%M %Z')"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/master" ]; then
            # Pages deploy replaces the WHOLE site, so carry the prior page-per-sha
            # reports + manifest forward from the live site (first deploy: history.tsv
            # 404s and we start empty). Then assemble index.html (latest) + <sha>/ +
            # history.html. --published makes the PR-comment "Full report" link live.
            if curl -sfL --retry 3 "$PAGES_URL/history.tsv" -o report/history.tsv; then
              while IFS=$'\t' read -r sha _; do
                [ -n "$sha" ] || continue
                mkdir -p "report/$sha"
                curl -sfL --retry 3 "$PAGES_URL/$sha/index.html" -o "report/$sha/index.html" \
                  || rmdir "report/$sha" 2>/dev/null || true
              done < report/history.tsv
            fi
            scripts/build-test.sh --pass-env GITHUB_REPOSITORY -- cargo run -p cost-report -- --published \
              --sha "$REPORT_SHA" --generated-at "$GENERATED_AT" \
              --site report --md "$RUNNER_TEMP/pr_comment.md"
          else
            # PR: single standalone report for the artifact-less comment; the page
            # isn't published for this change yet, so no --site / no nav links.
            scripts/build-test.sh --pass-env GITHUB_REPOSITORY -- cargo run -p cost-report -- \
              --sha "$REPORT_SHA" --generated-at "$GENERATED_AT" \
              --html report/index.html --md "$RUNNER_TEMP/pr_comment.md"
          fi
          # The join optimizer's report, from the committed .costs.txt and .optimizer.txt,
          # its links into that commit's files. The image's python3 has pandas;
          # test_cost_report renders the page with it blocked. Rendered on a PR too, so
          # a page that cannot render fails here; only master's report/ is deployed.
          scripts/build-test.sh -- python3 scripts/exec_model/cost_report.py --sha "$REPORT_SHA"
          mkdir -p report/join-optimizer
          cp scripts/exec_model/testdata/goldens/cost_report.html report/join-optimizer/index.html

      # PR: upsert exactly one comment, keyed on the hidden sentinel. Restricted
      # to same-repo PRs — fork PRs get a read-only token, so a comment write
      # would fail; the Pages publish on master is the canonical artifact.
      # always(), so a failure here cannot take the cost-regression gate down with it —
      # one oversized body did exactly that, and both widgets went missing for one cause.
      - name: Upsert PR comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            // The sentinel is the file's FIRST LINE rather than a copy of the constant:
            // a sentinel spelled in both Rust and YAML is a constant that drifts.
            for (const name of ['pr_comment.md']) {
              const path = process.env.RUNNER_TEMP + '/' + name;
              // always() runs this after a failed generate step too, where the file is absent.
              if (!fs.existsSync(path)) { core.info(`no ${name}; skipping`); continue; }
              const body = fs.readFileSync(path, 'utf8');
              const sentinel = body.split('\n', 1)[0];
              // A derived sentinel needs checking on this side: an empty or leading-newline
              // file makes it '', and `includes('')` is true of EVERY comment — the upsert
              // would then edit whichever came first, a person's or the gate's, and look like
              // a widget that moved rather than one that broke.
              if (!sentinel.startsWith('<!-- peacockdb-')) {
                core.setFailed(`${name}: first line is not a sentinel: ${JSON.stringify(sentinel.slice(0, 40))}`);
                continue;
              }
              core.info(`${name}: ${body.length} bytes, sentinel ${sentinel}`);
              const existing = comments.find(c => c.body && c.body.includes(sentinel));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            }

      # --- PeacockDB CPU cost-regression gate (PR only) -----------------------
      # Diff this PR's .cost.txt totals against the PR's BASE commit, post a
      # per-query widget, and fail the build on any regression. Split into three
      # steps so the comment is visible even when the gate fails: compute (captures
      # the exit code without failing) → upsert comment (always) → fail iff regression.
      # The push/master path skips all three (no base diff, no PR) and no-ops cleanly.
      # always(), for the same reason its own upsert has it: a failure in the comment step
      # above must not decide whether this widget renders. One oversized body took both.
      - name: Cost-regression gate — compute + render
        id: cost_gate
        if: always() && github.event_name == 'pull_request'
        env:
          # The PR's actual base commit (not master tip), so the diff is PR-vs-base
          # and unaffected by other PRs merged to master meanwhile. Present locally
          # thanks to fetch-depth: 0 above.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # With no --sha, cost-report reads GITHUB_SHA for its links, and GITHUB_REPOSITORY for
        # the slug: both are passed into the image.
        run: |
          set +e
          scripts/build-test.sh --pass-env GITHUB_SHA --pass-env GITHUB_REPOSITORY -- \
            cargo run -q -p cost-report -- --cost-diff --base "$BASE_SHA" \
            --html "$RUNNER_TEMP/cost_diff.html" --md-diff "$RUNNER_TEMP/cost_diff.md"
          rc=$?
          set -e
          # rc is three things and the fail step below says which: 0 clean, 1 regressions
          # found, anything else the binary died or the image would not start (build-test.sh
          # exits 2, docker 125). `set +e` made a crash and a regression the
          # same red for an hour when a dead flag panicked here.
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "cost-diff exit code: $rc"

      # Upsert the regression widget under its OWN sentinel, independent of the
      # coverage comment. `always()` so a regression (which fails a later step) still
      # shows the table. Same-repo only — fork PRs get a read-only token; the gate
      # itself (fail step below) still runs on forks.
      - name: Cost-regression gate — upsert comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = process.env.RUNNER_TEMP + '/cost_diff.md';
            if (!fs.existsSync(path)) { core.info('no cost_diff.md (gate did not render); skipping'); return; }
            const body = fs.readFileSync(path, 'utf8');
            const sentinel = '<!-- peacockdb-cost-regression -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(sentinel));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # Red ❌ on the PR iff a regression is over cost-report's 10% gate (it exited nonzero),
      # AFTER the widget has been posted above.
      - name: Cost-regression gate — fail on regression
        if: github.event_name == 'pull_request' && steps.cost_gate.outputs.rc != '0'
        run: |
          if [ "${{ steps.cost_gate.outputs.rc }}" = "1" ]; then
            echo "::error::PeacockDB CPU cost regression over the 10% gate (see the cost-regression PR comment)."
          else
            echo "::error::cost-diff died with rc=${{ steps.cost_gate.outputs.rc }} — it computed no \
          diff, so this is not a cost result. See the cost-diff step's output."
          fi
          exit 1

      # On master, hand report/ to the deploy-pages job as the Pages artifact.
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: report

  # Publish the report to GitHub Pages (https://asymptote-tech.github.io/peacockdb/).
  # Separate job so the github-pages environment (and its master-only deployment
  # rules) never applies to PR runs.
  deploy-pages:
    name: Deploy cost report to Pages
    needs: cost-report
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One in-flight Pages deployment at a time; don't cancel a running deploy.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  # Tier B: cheap S3 metadata check for the large datasets (tpch-sf40, tpch-sf200,
  # tpcds-sf200). Pure list/head — no download, no disk — so it runs on the standard
  # runner on every PR + master push. Separate job so an S3 blip doesn't block the CPU/GPU
  # legs. Guards keep it honest without wedging master:
  #   * FORK PRs have no secrets -> the job SKIPS itself (nothing to check with no creds).
  #   * EMPTY bucket -> the script SKIPS that bucket (uploads take hours; empty != broken).
  #   * objects present but missing/zero/size-mismatched -> the script FAILS.
  s3-datasets:
    name: S3 datasets metadata check
    needs: changes
    runs-on: ubuntu-latest
    # No secrets on fork PRs -> skip rather than fail. gpu-tests needs no such guard: it never
    # runs on a pull_request.
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      # The check reads parquet footers over ranged GETs with pyarrow, and lists with aws: the
      # build image has both.
      - uses: ./.github/actions/build-image
        with:
          cudf: "25.02"
      - name: Check dataset buckets
        # Endpoint + region are not secret; every aws call must pass the endpoint or it
        # hits real AWS. If the secrets are unset (should not happen given the guard),
        # skip loudly rather than error on missing creds. The keys reach the image by name,
        # never in argv.
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "S3 credentials not present — skipping (fork PR or unconfigured)."
            exit 0
          fi
          scripts/build-test.sh --pass-env AWS_ACCESS_KEY_ID --pass-env AWS_SECRET_ACCESS_KEY -- \
            python3 scripts/check_s3_datasets.py \
            --endpoint https://storage.eu-north1.nebius.cloud:443
