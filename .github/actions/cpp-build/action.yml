name: Build peacockdb C++
description: >-
  Configures, builds and installs the peacockdb C++ library into cpp/build and cpp/install, in the
  build image against its cuDF at /opt/cudf, with ccache. After ./.github/actions/build-image with
  the same cudf and ccache 'true'. The image holds the compiler, cmake and ninja at their pins.

inputs:
  cudf:
    description: The build image's cuDF version, which picks the gcc (GCC_<v> in docker/pins.env).
    required: true

runs:
  using: composite
  steps:
    - name: Build (CPP)
      shell: bash
      env:
        CUDF: ${{ inputs.cudf }}
        # The link of the C++ test binaries finds libcudf's own dependencies here.
        LDFLAGS: -Wl,-rpath-link,/opt/cudf/lib
        # The cache the build-image action restores and saves; bounded, as the runner's disk is.
        CCACHE_MAXSIZE: 2G
      run: |
        set -euo pipefail
        [ "$CUDF" = "${PEACOCK_CUDF:-}" ] \
          || { echo "::error::cpp-build's cudf $CUDF is not the build image's, ${PEACOCK_CUDF:-none}: run build-image first, with the same cudf"; exit 1; }
        # The gcc the image was built with, which build.sh finds as gcc-<v>.
        key=GCC_${CUDF//./_}
        gcc=$(sed -n "s/^$key=//p" docker/pins.env)
        [ -n "$gcc" ] || { echo "::error::docker/pins.env has no $key"; exit 1; }
        scripts/build-test.sh --pass-env LDFLAGS --pass-env CCACHE_MAXSIZE -- scripts/build.sh \
          --configure --build --install --cudf_ROOT /opt/cudf --gcc-version "$gcc" --compiler-launcher ccache

    - name: ccache stats
      shell: bash
      env:
        CCACHE_MAXSIZE: 2G
      run: scripts/build-test.sh --pass-env CCACHE_MAXSIZE -- ccache -s
