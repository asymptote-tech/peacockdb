[package]
name = "peacockdb-core"
version = "0.1.0"
edition = "2024"

[features]
rust-only = ["peacockdb-ffi/rust-only"]
# Device tests. Not propagated to peacockdb-ffi: that crate is a C ABI binding with no
# device-conditional code, so a feature there would be a knob nothing reads.
gpu = []
# The shared test harness in `src/test_support/`. Turned on by the self dev-dependency
# below rather than by any CI flag, so `cargo test` sees the module and `cargo build`
# cannot name it. `inventory` comes with it: the registry lives there now.
test-support = ["dep:inventory"]

[build-dependencies]
flatc-fork = "0.6"

[dependencies]
arrow = "54.2.0"
datafusion = "45"
flatbuffers = "25"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
peacockdb-ffi = { path = "../peacockdb-ffi" }
# The CPU half of the shuffle hash: Spark-compatible murmur3 (create_murmur3_hashes), so
# lane assignment matches the GPU kernel by construction rather than by agreement. 0.6.0 is
# the DataFusion-45-compatible release (df ^45 / arrow ^54.1); 0.10 would force a df49 bump.
# default-features off to keep it lean.
datafusion-comet-spark-expr = { version = "0.6.0", default-features = false }
# Only for `test-support`: `test_support::RegistryEntry` is collected here and submitted by
# the test binaries, so the collect! side has to be in the library's own dependency set.
inventory = { version = "0.3", optional = true }

[dev-dependencies]
# Turns `test-support` on for `cargo test` and leaves it off for `cargo build`, so the
# harness needs no flag from CI and a plain build cannot see it.
peacockdb-core = { path = ".", features = ["test-support"] }
datafusion = "45"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
sha2 = "0.10"   # plan-bytes wire-format digests (already in the graph via DataFusion)
paste = "1"   # derive test fn idents from the unified (dataset, sf, query, device) macros
# Link-time test registry. Each test macro submits a RegistryEntry at its invocation site,
# so testdata/cost-registry.csv can be checked against what the suite ACTUALLY declares
# instead of scraping the suite files as text. Note inventory collects PER BINARY, so each
# test binary verifies the columns it owns — see test_support::assert_registry_matches_csv.
inventory = "0.3"

# No [patch] section needed